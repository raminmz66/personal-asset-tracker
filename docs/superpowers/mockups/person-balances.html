<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mockup · صفحه شخص (فقط موجودی)</title>
  <style>
    :root {
      --page: #f4efe6; --ink: #3d3428; --muted: #6a5f50;
      --rule: #cbbfad; --accent: #0f6b6b;
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #e0d7c8; font-family: Tahoma, Vazirmatn, sans-serif; color: var(--ink);
    }
    .phone {
      width: 280px; background: var(--page); border: 1px solid var(--rule);
      border-radius: 16px; overflow: hidden;
    }
    .bar {
      padding: 12px; border-bottom: 1px solid var(--rule); text-align: center;
      font-weight: 800; font-family: Georgia, serif;
    }
    .body { padding: 12px 14px 16px; }
    .sec {
      display: flex; justify-content: space-between; align-items: center;
      margin: 8px 0; font-size: 12px; font-weight: 700; color: var(--muted);
    }
    .link { color: var(--accent); font-size: 12px; font-weight: 700; }
    .row {
      display: flex; justify-content: space-between; padding: 12px 2px;
      border-bottom: 1px dashed var(--rule); font-size: 14px;
    }
    .row strong { font-variant-numeric: tabular-nums; }
    .settled {
      display: block; text-align: center; margin-top: 18px; padding-top: 14px;
      border-top: 1px dashed var(--rule); color: var(--accent); font-weight: 700; font-size: 13px;
    }
    .cap { text-align: center; font-size: 11px; color: var(--muted); padding: 8px; background: #efe8db; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="bar">علی</div>
    <div class="body">
      <div class="sec"><span>موجودی‌ها</span><span class="link">+ افزودن موجودی</span></div>
      <div class="row"><span>تومان</span><strong>۱۰٬۰۰۰٬۰۰۰</strong></div>
      <div class="row"><span>USDT</span><strong>۲۵۰</strong></div>
      <a class="settled">تسویه‌شده‌ها</a>
    </div>
    <div class="cap">بدون قلم / ابزار — فقط پول</div>
  </div>
</body>
</html>
