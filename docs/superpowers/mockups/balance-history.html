<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mockup · موجودی USDT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --page: #f4efe6; --ink: #3d3428; --muted: #6a5f50;
      --rule: #cbbfad; --accent: #0f6b6b; --danger: #8b3a2f;
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #e0d7c8; font-family: Vazirmatn, Tahoma, sans-serif; color: var(--ink);
    }
    .phone {
      width: 280px; background: var(--page); border: 1px solid var(--rule);
      border-radius: 16px; overflow: hidden;
    }
    .bar {
      padding: 12px; border-bottom: 1px solid var(--rule); text-align: center;
      font-weight: 400; font-family: Lalezar, Vazirmatn, sans-serif; font-size: 14px;
    }
    .body { padding: 12px 14px 16px; }
    .hero { text-align: center; padding: 16px 8px; border-bottom: 1px solid var(--rule); }
    .hero-label { font-size: 12px; color: var(--muted); }
    .hero-num { font-size: 40px; font-weight: 800; margin-top: 4px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .btn {
      background: var(--accent); color: var(--page); border: none; border-radius: 8px;
      padding: 10px; font-weight: 700; font-family: inherit;
    }
    .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .sec { font-size: 12px; font-weight: 700; color: var(--muted); margin: 8px 0; }
    .tx {
      display: flex; justify-content: space-between; padding: 10px 2px;
      border-bottom: 1px dashed var(--rule); font-size: 13px;
    }
    .plus { color: var(--accent); font-weight: 800; }
    .minus { color: var(--danger); font-weight: 800; }
    .date { font-size: 11px; color: var(--muted); }
    .cap { text-align: center; font-size: 11px; color: var(--muted); padding: 8px; background: #efe8db; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="bar">علی · USDT</div>
    <div class="body">
      <div class="hero">
        <div class="hero-label">موجودی فعلی</div>
        <div class="hero-num">۲۵۰</div>
      </div>
      <div class="actions">
        <button class="btn">واریز</button>
        <button class="btn ghost">برگشت</button>
      </div>
      <div class="sec">تاریخچه</div>
      <div class="tx"><div>واریز<div class="date">۱۲ تیر ۱۴۰۴</div></div><span class="plus">+۱۰۰</span></div>
      <div class="tx"><div>برگشت<div class="date">۲۰ تیر ۱۴۰۴</div></div><span class="minus">−۵۰</span></div>
      <div class="tx"><div>واریز<div class="date">۱ خرداد ۱۴۰۴</div></div><span class="plus">+۲۰۰</span></div>
    </div>
    <div class="cap">فقط واریز / برگشت — بدون قلم</div>
  </div>
</body>
</html>
