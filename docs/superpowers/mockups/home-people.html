<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mockup · خانه</title>
  <style>
    :root {
      --page: #f4efe6; --ink: #3d3428; --muted: #6a5f50; --rule: #cbbfad; --accent: #0f6b6b;
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #e0d7c8; font-family: Tahoma, Vazirmatn, sans-serif; color: var(--ink);
    }
    .phone {
      width: 280px; background: var(--page); border: 1px solid var(--rule);
      border-radius: 16px; overflow: hidden;
    }
    .bar {
      display: grid; grid-template-columns: 24px 1fr 24px; align-items: center;
      padding: 12px; border-bottom: 1px solid var(--rule);
    }
    .title { text-align: center; font-weight: 800; font-family: Georgia, serif; }
    .gear { color: var(--muted); text-align: left; }
    .body { padding: 8px 14px 16px; }
    .person { padding: 12px 2px; border-bottom: 1px dashed var(--rule); }
    .name { font-weight: 700; font-family: Georgia, serif; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .add { display: block; text-align: center; margin-top: 14px; color: var(--accent); font-weight: 700; font-size: 12px; }
    .cap { text-align: center; font-size: 11px; color: var(--muted); padding: 8px; background: #efe8db; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="bar"><span></span><span class="title">امانت‌ها</span><span class="gear">⚙</span></div>
    <div class="body">
      <div class="person"><div class="name">علی</div><div class="meta">۲ موجودی فعال</div></div>
      <div class="person"><div class="name">سارا</div><div class="meta">۱ موجودی فعال</div></div>
      <div class="person"><div class="name">رضا</div><div class="meta">تسویه</div></div>
      <a class="add">+ افزودن شخص</a>
    </div>
    <div class="cap">خانه · پول نزد شما از طرف دیگران</div>
  </div>
</body>
</html>
